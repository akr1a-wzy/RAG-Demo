[project]
name = "a-share-qa-langgraph"
version = "0.1.0"
description = "可复现的 A 股事实型问答与文档 RAG 项目"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "chromadb>=1.0,<2",
    "diskcache>=5.6,<6",
    "fastapi>=0.116,<1",
    "httpx>=0.28,<1",
    "langchain-chroma>=0.2,<1",
    "langchain-huggingface>=0.3,<1",
    "langchain-text-splitters>=0.3,<1",
    "langgraph>=0.6,<1",
    "langgraph-checkpoint-sqlite>=2.0,<3",
    "pydantic-settings>=2.10,<3",
    "pymupdf>=1.26,<2",
    "pypdf==6.12.1",
    "sentence-transformers>=5.0,<6",
    "tenacity>=9.1,<10",
    "torch==2.14.0; sys_platform != 'win32'",
    "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
gpu = ["torch==2.14.1; sys_platform == 'win32'"]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu130", extra = "gpu", marker = "sys_platform == 'win32'" },
    { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "pytest>=8.4,<9",
    "pytest-asyncio>=1.1,<2",
    "pytest-cov>=6.2,<7",
    "respx>=0.22,<1",
    "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
exclude = [".venv", "tmp"]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
